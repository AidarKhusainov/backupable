services:
  backupable:
    image: ghcr.io/aidarkhusainov/backupable:latest
    container_name: backupable
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      BACKUPABLE_BACKUP_DIR: /var/lib/backupable/jobs
      BACKUPABLE_STATE_DIR: /var/lib/backupable/state
      BACKUPABLE_SCHEDULER_MODE: internal
      BACKUPABLE_POLL_SECONDS: ${BACKUPABLE_POLL_SECONDS:-60}
      BACKUPABLE_SOURCE_LABEL: ${BACKUPABLE_SOURCE_LABEL:-}
    volumes:
      - backupable-data:/var/lib/backupable
      - /opt/remnawave:/opt/remnawave:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  backupable-data:
